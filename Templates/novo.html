<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='novo.css') }}">
</head>
<body class="pagina-novo">

<h1>Formulário</h1>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<form action="{{ url_for('criar') }}" method="post">

    <p>
        <label for="titulo">Título</label>
        <input type="text" id="titulo" name="titulo" required>
    </p>

    <p>
        <label for="autor">Autor</label>
        <input type="text" id="autor" name="autor" required>
    </p>

    <p>
        <label for="ano_publicado">Ano de Publicação</label>
        <input type="number" id="ano_publicado" name="ano_publicado" required>
    </p>

    <button type="submit">Salvar</button>

</form>


</body>
</html>
