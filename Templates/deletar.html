<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Deletar</title>
</head>
<body>

    <h2>Deletar livro</h2>

    <form action="{{ url_for('deletar', id=livro[0]) }}" method="post">

        <label for="titulo">Título:</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            value="{{ livro[1] }}"
            required
        >

        <label for="autor">Autor:</label>
        <input
            type="text"
            id="autor"
            name="autor"
            value="{{ livro[2] }}"
            required
        >

        <label for="ano_publicado">Ano de publicação:</label>
        <input
            type="number"
            id="ano_publicado"
            name="ano_publicado"
            value="{{ livro[3] }}"
            required
        >

        <button type="submit">Deletar</button>

    </form>

</body>
</html>
